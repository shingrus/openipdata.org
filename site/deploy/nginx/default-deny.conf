# Catch-all servers: any request whose Host matches no site, or that has no usable TLS name, is dropped.
# Installed by init-openipdata-site.sh into /etc/nginx/sites-available and ALWAYS enabled, because it
# needs no certificate: the origin is closed even before the certificate exists.
# The real site is openipdata.org.conf (enabled only once the certificate exists).
# The IPv6 listens need an IPv6-enabled host.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}
