# openipdata.org behind Cloudflare. Installed by init-openipdata-site.sh into
# /etc/nginx/sites-available; the script enables it once the certificate exists.
# The catch-all servers are in default-deny.conf (always enabled, no certificate).
# The certificate comes from certbot (Cloudflare DNS challenge), never from the script.
# $from_cloudflare and the real-IP settings are generated by openipdata-cf-ips
# (/etc/nginx/conf.d/cloudflare-realip.conf, read before this file).
# Only Cloudflare reaches the site: any other peer gets 444. After realip,
# $remote_addr is the visitor, so the access log can be tailed by iplistener.

server {
    listen 80;
    listen [::]:80;
    server_name openipdata.org www.openipdata.org;
    if ($from_cloudflare = 0) { return 444; }
    return 301 https://openipdata.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.openipdata.org;
    ssl_certificate /etc/letsencrypt/live/openipdata.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openipdata.org/privkey.pem;
    if ($from_cloudflare = 0) { return 444; }
    return 301 https://openipdata.org$request_uri;
}

server {
    # nginx 1.24 (Ubuntu 24.04) has no "http2 on;" yet: http2 is a listen parameter.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openipdata.org;

    ssl_certificate /etc/letsencrypt/live/openipdata.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openipdata.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    if ($from_cloudflare = 0) { return 444; }

    access_log /var/log/nginx/openipdata.org.access.log;
    client_max_body_size 1k;

    gzip on;
    gzip_types text/plain text/css;
    gzip_min_length 512;

    # /healthz shows the commit; the updater asks 127.0.0.1:8080 directly.
    location = /healthz { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
