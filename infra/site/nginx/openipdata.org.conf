# openipdata.org behind Cloudflare. Installed by init-openipdata-site.sh into
# /etc/nginx/sites-available; the script enables it once the certificate exists.
# The catch-all servers are in default-deny.conf (always enabled, no certificate).
# The certificate comes from certbot (Cloudflare DNS challenge), never from the script.
# $from_cloudflare and the real-IP settings are generated by openipdata-cf-ips
# (/etc/nginx/conf.d/cloudflare-realip.conf, read before this file).
# Only Cloudflare reaches the site: any other peer gets 444. After realip,
# $remote_addr is the visitor, so the access log can be tailed by iplistener.
# The upstream openipdata_site comes from /etc/nginx/conf.d/openipdata-site-live.conf, a link to
# /etc/nginx/openipdata-site/upstream-<port>.conf; openipdata-site-update switches it (blue/green).

# POST /share (the Share button creates a report): 1 request per second per visitor address.
limit_req_zone $remote_addr zone=openipdata_share:1m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openipdata.org;
    if ($from_cloudflare = 0) { return 444; }
    return 301 https://openipdata.org$request_uri;
}

server {
    # nginx 1.24 (Ubuntu 24.04) has no "http2 on;" yet: http2 is a listen parameter.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openipdata.org;

    ssl_certificate /etc/letsencrypt/live/openipdata.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openipdata.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    if ($from_cloudflare = 0) { return 444; }

    access_log /var/log/nginx/openipdata.org.access.log;
    client_max_body_size 1k;

    gzip on;
    gzip_types text/plain text/css application/json;
    gzip_min_length 512;

    # /healthz shows the commit; the updater asks the instance port directly.
    location = /healthz { return 404; }

    # The site checks the method and the X-Share header; no CORS header is added here or there.
    location = /share {
        limit_req zone=openipdata_share burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://openipdata_site;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://openipdata_site;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Always set here, so a header sent by a client is replaced. The site reads it
        # (REAL_IP_HEADER) only from this loopback connection.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
