# https://<token>.r.openipdata.org/ : the page of the visitor's DNS resolver. The browser looks up the
# one-time name <32 hex>.r.openipdata.org (served by Knot, see ../knot/), which makes the visitor's
# resolver ask us and openipdata-beacon store its address under that token in Redis; then the browser
# fetches this name over HTTPS and the site's /resolver answers from Redis. Installed by
# init-openipdata-site.sh into /etc/nginx/sites-available; the script enables it once its certificate
# (*.r.openipdata.org, certbot with the DNS challenge answered by Knot) exists, like v46.openipdata.org.conf.
#
# Same rules as v46.openipdata.org.conf: the names under r point straight at this VM (NOT through
# Cloudflare), so a request whose TCP peer is a Cloudflare address ($from_cloudflare = 1, from
# cloudflare-realip.conf) gets 403; the visitor address is $realip_remote_addr, the TCP peer, never a
# client-supplied header; only "/" (GET, HEAD) reaches the site, every other path is 404; own access log
# with no address, no host and no token (the token is a one-time name, still never written down).
# The site sets its own response headers (CORS included); nginx adds none.
# Only a name that is exactly <32 lower-case hex>.r.openipdata.org matches here; any other name under r
# (and every other host) falls to default-deny.conf, which rejects the TLS handshake.

limit_req_zone $realip_remote_addr zone=openipdata_r:1m rate=10r/s;

log_format openipdata_r '$time_iso8601 $status';

server {
    listen 80;
    listen [::]:80;
    # In quotes: a regular expression with { } must be quoted, or nginx reads the brace as a block.
    server_name "~^[0-9a-f]{32}\.r\.openipdata\.org$";
    access_log off;
    return 404;
}

server {
    # nginx 1.24 (Ubuntu 24.04) has no "http2 on;" yet: http2 is a listen parameter.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name "~^(?<token>[0-9a-f]{32})\.r\.openipdata\.org$";

    ssl_certificate /etc/letsencrypt/live/r.openipdata.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/r.openipdata.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/r.openipdata.org.access.log openipdata_r;
    client_max_body_size 1k;
    # The page retries a few times; a small burst covers that.
    limit_req zone=openipdata_r burst=10 nodelay;
    limit_req_status 429;

    if ($from_cloudflare = 1) { return 403; }

    location = / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        # Hex only (the server_name pattern), so $token is safe in the URI.
        proxy_pass http://openipdata_site/resolver?t=$token;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $realip_remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The page's first request: it only makes the visitor's resolver look the name up. Answered
    # here, the site is not asked.
    location = /t { return 204; }

    location / { return 404; }
}
