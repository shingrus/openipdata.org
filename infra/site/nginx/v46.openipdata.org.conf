# v4.openipdata.org (A record only) and v6.openipdata.org (AAAA record only): the two names the page
# asks for the visitor's second address (a browser connects over one family only). Installed by
# init-openipdata-site.sh into /etc/nginx/sites-available; the script enables it once the certificate
# exists, like openipdata.org.conf. Same certificate (it covers *.openipdata.org), same TLS settings.
#
# These names are DNS-only: they point straight at this VM, NOT through Cloudflare, so they accept
# direct visitors and expose the VM's address by design. They must never be answered through Cloudflare:
# a proxied request arrives from a Cloudflare address, so the page would show Cloudflare's own address as
# the visitor's second address. So every request whose TCP peer is in a Cloudflare range
# ($from_cloudflare = 1, defined for every request by the geo block of cloudflare-realip.conf, the same
# file openipdata.org.conf relies on) gets 403 here, on both ports and for every path, before anything
# reaches the site. The page's fetch then fails and the dash stays. (If the DNS records are proxied by
# mistake, this is what shows it.)
#
# The address of the visitor is the TCP peer. cloudflare-realip.conf (generated by openipdata-cf-ips)
# sets real_ip_header CF-Connecting-IP, but nginx's realip module rewrites $remote_addr only for a peer
# in a set_real_ip_from range (Cloudflare's); for a direct visitor the header is ignored and
# $remote_addr stays the peer. Even so, this file never uses $remote_addr: it uses $realip_remote_addr,
# which is always the TCP peer (also for a connection from a Cloudflare range that sends the header),
# so no client-supplied CF-Connecting-IP can ever become the answer or the rate-limit key. The header
# is also dropped before the request goes to the site.
#
# Only "/" is served (proxied to the site's /ip, same upstream as openipdata.org); every other path
# is 404 here and never reaches the site. Own access log, without the visitor address (the log of
# openipdata.org is tailed by iplistener; this one is not).

limit_req_zone $realip_remote_addr zone=openipdata_v46:1m rate=5r/s;

# $uri, not $request_uri: the query string can hold the id of a shared report, which is a secret.
log_format openipdata_v46 '$time_iso8601 $host $status $request_method "$uri" $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    # nginx 1.24 (Ubuntu 24.04) has no "http2 on;" yet: http2 is a listen parameter.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name v4.openipdata.org v6.openipdata.org;

    ssl_certificate /etc/letsencrypt/live/openipdata.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openipdata.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/v46.openipdata.org.access.log openipdata_v46;
    client_max_body_size 1k;
    # Helper hosts, never to be indexed (Googlebot runs the page script and finds them); a header, since a
    # robots.txt block would hide it. "always" so 403, 404, 405 and 429 carry it; no location has its own
    # add_header, so it is inherited by all.
    add_header X-Robots-Tag "noindex, nofollow" always;
    limit_req zone=openipdata_v46 burst=10 nodelay;
    limit_req_status 429;

    # Server level: runs before any location, for http and https alike.
    if ($from_cloudflare = 1) { return 403; }

    location = / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://openipdata_site/ip;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Always set here, so a header sent by a client is replaced. The TCP peer, never the
        # CF-Connecting-IP value (see above).
        proxy_set_header X-Real-IP $realip_remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { return 404; }
}
