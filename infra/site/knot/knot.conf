# Knot DNS for the zone r.openipdata.org (the resolver beacon). Installed by init-openipdata-site.sh
# as /etc/knot/knot.conf: the script fills in the public addresses of the VM (a listen line
# with no address is removed). Check by hand: sudo knotc conf-check
#
# Query names are never logged: Knot logs no queries at this level, and the dnstap sink below only
# hands the resolver address and the name to openipdata-beacon, which keeps neither on disk.

server:
    rundir: /run/knot
    user: knot:knot
    # Only the public addresses of this VM, plus loopback for the certbot DNS challenge (dynamic
    # update by the local certbot, see the acl below). Never 0.0.0.0, so systemd-resolved's
    # 127.0.0.53 and anything else on the machine is left alone.
    listen: 127.0.0.1@53
    listen: __PUBLIC_IPV4__@53
    listen: __PUBLIC_IPV6__@53

log:
  - target: syslog
    any: warning

database:
    storage: /var/lib/knot

# The key for dynamic updates, generated once by the init script (root:knot, 0640, never printed).
include: /etc/knot/openipdata-acme-key.conf

# Response rate limiting. A busy public resolver (one address, many visitors) sends many queries, so
# the limit is far above normal use: it only cuts a flood from one network prefix. slip: 2 answers
# every second limited query with a truncated reply, so a real resolver retries over TCP. The beacon
# still sees the limited queries (dnstap logs the query before the response is rate-limited).
mod-rrl:
  - id: beacon
    rate-limit: 300
    slip: 2

# Every query of the zone goes to openipdata-beacon (a unix socket, framestream). Queries only: the
# responses are not needed.
mod-dnstap:
  - id: beacon
    sink: unix:/run/openipdata-beacon/dnstap.sock
    log-queries: on
    log-responses: off

# Only the local certbot may change the zone, with its own key, only from loopback, only TXT records
# at _acme-challenge of the zone (the DNS challenge of the certificate for *.r.openipdata.org).
# There is no transfer ACL and no notify or master, so no zone transfer is possible.
acl:
  - id: acme_update
    address: 127.0.0.1
    key: acme
    action: update
    update-type: TXT
    update-owner: name
    update-owner-match: equal
    update-owner-name: _acme-challenge

zone:
  - domain: r.openipdata.org
    file: /var/lib/knot/zones/r.openipdata.org.zone
    # The zone file is written by the init script and is the whole truth. Knot never writes it back
    # (-1): the challenge record only lives in Knot's memory and journal, and the file and Knot's own
    # changes cannot fight over it. A changed file (higher serial) is loaded by the script's restart.
    zonefile-sync: -1
    acl: acme_update
    module: [mod-dnstap/beacon, mod-rrl/beacon]
