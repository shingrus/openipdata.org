# A push to master that changes the worker code (hatchet/, mmdbbuilder/) or this file, or the
# Run workflow button, tests and builds openipdata-worker and mmdbbuilder. Only a run on master
# publishes: it replaces the assets of the rolling release with the tag `worker`, and the worker
# VM installs them by itself (infra/openipdata-worker-update). The tag `worker` does not start
# any workflow, and a tag made with github.token never does anyway, so publishing cannot trigger
# itself.
name: Publish worker binaries

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'hatchet/**'
      - 'mmdbbuilder/**'
      - '.github/workflows/worker.yml'

permissions:
  contents: write

concurrency:
  group: worker-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Publish only from master. Other refs (a manual run on a branch) only test and build.
      - name: Gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          publish=false
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            publish=true
            echo "publish: run on master"
          else
            echo "no publish: ${GITHUB_REF} is not master"
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: hatchet/go.mod
          cache-dependency-path: |
            hatchet/go.sum
            mmdbbuilder/go.sum

      # The Postgres integration tests skip themselves without their environment variable.
      - name: Check and test worker
        shell: bash
        working-directory: hatchet
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          go vet ./...
          go test -race ./...

      - name: Check and test mmdbbuilder
        shell: bash
        working-directory: mmdbbuilder
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          go vet ./...
          go test -race ./...

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          # The version is the commit (no spaces): the updater compares what each binary
          # prints for `version` with the manifest line exactly.
          version="$GITHUB_SHA"
          mkdir dist
          (cd hatchet && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${version}" -o ../dist/openipdata-worker-linux-amd64 .)
          (cd mmdbbuilder && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${version}" -o ../dist/mmdbbuilder-linux-amd64 .)
          cd dist
          # The manifest: two sha256sum lines, then the version. It is uploaded last.
          {
            sha256sum openipdata-worker-linux-amd64 mmdbbuilder-linux-amd64
            echo "version ${version}"
          } > worker.sha256
          cat worker.sha256

      - name: Publish release
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          notes="Commit ${GITHUB_SHA}, built ${built} by run ${GITHUB_RUN_ID}."
          if ! out="$(gh release view worker --json tagName 2>&1)"; then
            if grep -qi 'release not found' <<<"$out"; then
              gh release create worker --title "Worker binaries" --notes "$notes" --target "$GITHUB_SHA" --latest=false
            else
              echo "$out" >&2
              exit 1
            fi
          fi
          # The tag is not moved (as for the release `site`): the commit is in the notes and in
          # the version line of the manifest.
          # Both binaries first, then the manifest: a new manifest always has its binaries.
          # During an upload a binary can be missing for a moment, or newer than the manifest;
          # the updater on the VM treats a 404 or a hash mismatch as "try later", never as a
          # failed release.
          gh release upload worker dist/openipdata-worker-linux-amd64 --clobber
          gh release upload worker dist/mmdbbuilder-linux-amd64 --clobber
          gh release upload worker dist/worker.sha256 --clobber
          gh release edit worker --latest=false --notes "$notes"
